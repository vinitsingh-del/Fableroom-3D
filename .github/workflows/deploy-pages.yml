name: Deploy Fableroom 3D to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original cabinet images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/product
          ASSET_BASE="https://fableroom-3d.vinit-singh482832.chatgpt.site/product"
          for file in \
            cabinet-front.png \
            cabinet-three-quarter.png \
            cabinet-rear.png \
            cabinet-open.png \
            cabinet-detail.png \
            cabinet-room.png
          do
            curl --fail --location --retry 3 --retry-delay 2 \
              "${ASSET_BASE}/${file}" \
              --output "public/product/${file}"
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /Fableroom-3D

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
